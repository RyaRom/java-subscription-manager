app:
  github-token: ${GITHUB_TOKEN}
  stackoverflow:
    key: ${SO_TOKEN_KEY}
    access-token: ${SO_ACCESS_TOKEN}
    token-disabled: true
  bot-url: http://localhost:8080/bot/api


spring:
  application:
    name: Scrapper
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  config:
    import: optional:file:.env[.properties]

server:
  port: 8081

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui

