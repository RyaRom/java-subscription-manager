app:
  main:
    stackoverflow:
      key: ${SO_TOKEN_KEY}
      access-token: ${SO_ACCESS_TOKEN}
      token-disabled: true
    update-cron: "0 0 */12 * * ?"
  clients:
    bot-url: http://localhost:8080/bot/api
    github-token: ${GITHUB_TOKEN}
    stack-overflow-url: https://api.stackexchange.com/2.3
    github-url: https://api.github.com


spring:
  application:
    name: Scrapper
  liquibase:
    enabled: true
    change-log: classpath:/liquibase/master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: dev
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

server:
  port: 8081

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui
