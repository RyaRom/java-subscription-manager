<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Команды бота</title>
</head>
<body>
<h1>Список команд</h1>
<ul>
    <li><strong>/start</strong> - Начать работу с ботом</li>
    <li><strong>/help</strong> - Список команд</li>
    <li><strong>/track {link}</strong> - Начать отслеживание ссылки</li>
    <li><strong>/untrack {link}</strong> - Остановить отслеживание ссылки</li>
    <li><strong>/list</strong> - Список отслеживаемых ссылок</li>
</ul>
</body>
</html>
