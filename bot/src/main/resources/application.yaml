app:
  bot:
    settings:
      commands:
        - command: /start
          description: Начать работу с ботом
        - command: /help
          description: Список команд
        - command: /track
          description: Начать отслеживание ссылки
        - command: /untrack
          description: Остановить отслеживание ссылки
        - command: /list
          description: Список отслеживаемых ссылок
  telegram:
    telegram-token: ${TELEGRAM_TOKEN}
  clients:
    scrapper-url: http://localhost:8081/scrapper/api
    timeout: 3000
    retry:
      max-attempts: 2
      wait-duration: 100
  data:
    redis: ${REDIS_URL}
    redis-ex-ms: 600000

spring:
  application:
    name: Bot
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: dev
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
    kafka-topics-names:
      link-updates: link-updates

server:
  port: 8080

resilience2:
  retry:
    max-attempts: 4
    wait-duration: 100
    blacklisted-status-codes:
      - 400
      - 401
      - 403
      - 404
      - 405
  rate-limiter:
    max-tokens: 50
    tokens-per-second: 10
  circuit-breaker:
    init-calls: 5
    window-size: 100
    failure-rate-threshold: 50
    wait-duration-in-open-state-ms: 1000
    half-open-calls-permitted: 10



springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui

logging:
  config:
    classpath:log4j2.xml
