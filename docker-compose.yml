services:
  postgres:
    image: postgres:latest
    container_name: postgres_container
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: web-scrapper
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5430:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "PGPASSWORD=${POSTGRES_PASSWORD} pg_isready -U ${POSTGRES_USERNAME} -d web-scrapper" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true

  liquibase-migrations:
    container_name: migrations
    image: liquibase/liquibase:4.29
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - --url=jdbc:postgresql://postgres_container:5432/web-scrapper
      - --username=${POSTGRES_USERNAME}
      - --password=${POSTGRES_PASSWORD}
      - --changelog-file=master.yaml
      - --classpath=/liquibase/changelog
      - --searchPath=/liquibase/changelog
      - update
    volumes:
      - ./scrapper/src/main/resources/migrations:/liquibase/changelog

volumes:
  pgdata:
    driver: local
